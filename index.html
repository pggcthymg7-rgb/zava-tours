<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zava Tour — Editor</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.5.0/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.5.0/index.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; background: #0b0b0b; color: #fff; overflow: hidden; position: fixed; touch-action: none; }
    #viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; touch-action: none; }

    #welcome-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; text-align: center; }
    #welcome-screen h1 { color: #c5a059; font-size: 32px; margin-bottom: 8px; letter-spacing: 2px; }
    #welcome-screen p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
    
    .btn-gold { background: #c5a059; color: #000; font-size: 16px; padding: 16px 32px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(197,160,89,0.3); transition: 0.2s; text-align: center; touch-action: manipulation; }
    .btn-gold:active { transform: scale(0.95); }
    .hidden { display: none !important; }

    #menu-toggle { position: absolute; bottom: 20px; right: 20px; z-index: 9999; width: 60px; height: 60px; border-radius: 50%; background: #c5a059; color: #000; border: none; font-size: 24px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; display: none; align-items: center; justify-content: center; transition: 0.2s; touch-action: manipulation; }
    #menu-toggle:active { transform: scale(0.9); }

    #controls-panel { position: absolute; bottom: 90px; right: 20px; width: 280px; background: rgba(20, 20, 20, 0.95); border: 1px solid #2c2c2c; border-radius: 12px; padding: 16px; z-index: 9998; display: none; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px); touch-action: manipulation; }
    #controls-panel.open { display: flex; }
    
    .controls-title { color: #c5a059; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .btn-outline { background: transparent; border: 1px solid #c5a059 !important; color: #fff; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; text-align: center; touch-action: manipulation; }
    .btn-outline.ativo { background: rgba(197, 160, 89, 0.3); border: 2px solid #fff !important; }
    
    .link-box { background: #222; color: #fff; font-size: 11px; padding: 10px; border-radius: 6px; border: 1px solid #333; width: 100%; box-sizing: border-box; margin-bottom: 4px; }
    .hidden-input { display: none; }

    .custom-marker { width: 20px; height: 20px; background: #c5a059; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(197,160,89,0.9); cursor: pointer; }
    .dot-marker { width: 14px; height: 14px; background: #fff; border: 2px solid #c5a059; border-radius: 50%; box-shadow: 0 0 5px #000; pointer-events: none; }
    
    #aviso-modo { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #c5a059; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; z-index: 9997; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); white-space: nowrap; pointer-events: none; }
    
    #action-buttons { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none; gap: 10px; touch-action: manipulation; pointer-events: auto; }
    .btn-action { color: #fff; padding: 14px 20px; border-radius: 30px; border: none; font-weight: bold; font-size: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; touch-action: manipulation; white-space: nowrap; pointer-events: auto; }
    .btn-action:active { transform: scale(0.95); }
    .btn-undo { background: #ff9800; }
    .btn-done { background: #4CAF50; }
    .btn-cancel { background: #f44336; }

    #panel-edicao { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, 0.95); color: #fff; padding: 16px 24px; border-radius: 12px; border: 1px solid #c5a059; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 9999; display: none; text-align: center; min-width: 200px; backdrop-filter: blur(10px); touch-action: manipulation; }
    #panel-edicao h3 { margin: 0; font-size: 16px; color: #c5a059; margin-bottom: 10px; }
    .btn-delete { background: #f44336; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; touch-action: manipulation; }
    .btn-close-panel { background: #333; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="welcome-screen">
    <h1>❖ ZAVA TOUR</h1>
    <p>Editor de Tour Virtual 360°</p>
    <input type="file" id="foto" accept="image/jpeg" class="hidden-input">
    <button class="btn-gold" onclick="document.getElementById('foto').click()">📂 Carregar Foto 360°</button>
  </div>

  <div id="viewer"></div>
  <div id="aviso-modo"></div>
  
  <div id="action-buttons">
    <button class="btn-action btn-undo" onclick="desfazerPonto(event)">↩️ Desfazer</button>
    <button class="btn-action btn-done" onclick="finalizarPoligono(event)">✅ Concluir</button>
    <button class="btn-action btn-cancel" onclick="cancelarDesenho(event)">❌</button>
  </div>

  <div id="panel-edicao">
    <h3 id="edit-title">Elemento Selecionado</h3>
    <button class="btn-delete" onclick="apagarSelecionado(event)">🗑️ Apagar Elemento</button>
    <button class="btn-close-panel" onclick="fecharPainelEdicao(event)">Fechar</button>
  </div>

  <button id="menu-toggle" onclick="toggleMenu(event)">☰</button>

  <div id="controls-panel">
    <div class="controls-title">Opções do Tour</div>
    <button class="btn-outline" id="btn-marcar" onclick="toggleModoMarcacao(event)">📍 Adicionar Ponto</button>
    <button class="btn-outline" id="btn-desenhar" onclick="toggleModoDesenho(event)">✏️ Desenhar Lote</button>
    <hr style="border-color:#333; margin:8px 0; width:100%;">
    <button class="btn-gold" id="btn-salvar" onclick="salvarTour(event)" style="padding:12px; font-size:14px;">💾 Salvar tour</button>
    <p style="font-size:11px; color:#aaa; margin:4px 0;">Link gerado:</p>
    <input type="text" id="linkTour" readonly placeholder="Ainda não salvo" class="link-box">
    <button class="btn-outline" onclick="copiarLink(event)" style="padding:8px; font-size:12px;">🔗 Copiar link</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.163.0",
        "three/addons/": "https://esm.sh/three@0.163.0/examples/jsm/",
        "@photo-sphere-viewer/core": "https://esm.sh/@photo-sphere-viewer/core@5.5.0",
        "@photo-sphere-viewer/markers-plugin": "https://esm.sh/@photo-sphere-viewer/markers-plugin@5.5.0"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  
  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

    let viewer = null;
    let marcacoes = [];
    let modoPonto = false;
    let modoDesenho = false;
    let pontosPoligonoAtual = [];
    let selectedMarkerId = null;

    function iniciarViewer(imagem) {
      if (viewer) viewer.destroy();
      
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('menu-toggle').style.display = 'flex';

      viewer = new Viewer({
        container: 'viewer',
        panorama: if imagem,
        navbar: false,
        touchmoveTwoFingers: false,
        plugins: [[MarkersPlugin, { markers: [] }]]
      });

      const markersPlugin = viewer.getPlugin(MarkersPlugin);

      viewer.addEventListener('click', ({ data }) => {
        if (!data || typeof data.yaw === 'undefined') return;
        
        fecharPainelEdicao();
        const { yaw, pitch } = data;
        
        (modoPonto) {
          const titulo = prompt('Título da marcação (ex: Portaria):');
          if (titulo) {
            const id = 'marcador_' + Date.now();
            markersPlugin.addMarker({
              id: id, position: { yaw, pitch }, html: `<div class="custom-marker"></div>`, anchor: 'center center'
            });
            marcacoes.push({ id: id, type: 'ponto', yaw, pitch, titulo });
          }
          desativarModos();
        }
        
        if (modoDesenho) {
          pontosPoligonoAtual.push({ yaw, pitch });
          markersPlugin.addMarker({
            id: 'dot_' + pontosPoligonoAtual.length,
            position: { yaw, pitch },
            html: '<div class="dot-marker"></div>',
            anchor: 'center center'
          });
        }
      });

      markersPlugin.addEventListener('select-marker', ({ marker }) => {
        if (modoPonto || modoDesenho) return;
        selectedMarkerId = marker.id;
        document.getElementById('panel-edicao').style.display = 'block';
        document.getElementById('edit-title').innerText = (marker.config.data && marker.config.data.titulo) ? marker.config.data.titulo : 'Lote Desenhado';
      });
    }

    document.getElementById('foto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        iniciarViewer(ev.target.result);
        marcacoes = [];
        desativarModos();
      };
      reader.readAsDataURL(file);
    });

    window.toggleMenu = function(event) {
      if(event) { event.stopPropagation(); }
      const panel = document.getElementById('controls-panel');
      const btn = document.getElementById('menu-toggle');
      panel.classList.toggle('open');
      btn.innerText = panel.classList.contains('open') ? '✕' : '☰';
    }

    window.toggleModoMarcacao = function(event) {
      if(event) { event.stopPropagation(); }
      if (modoDesenho) cancelarDesenho();
      modoPonto = !modoPonto;
      atualizarBotoesUI();
    }

    window.toggleModoDesenho = function(event) {
      if(event) { event.stopPropagation(); }
      if (modoPonto) desativarModos();
      
      if (modoDesenho) {
        cancelarDesenho(); 
      } else {
        modoDesenho = true;
        pontosPoligonoAtual = [];
        document.getElementById('action-buttons').style.display = 'flex';
        atualizarBotoesUI();
      }
    }

    window.desfazerPonto = function(event) {
      if(event) { event.stopPropagation(); }
      if (pontosPoligonoAtual.length > 0) {
        const markersPlugin = viewer.getPlugin(MarkersPlugin);
        const lastDotId = 'dot_' + pontosPoligonoAtual.length;
        pontosPoligonoAtual.pop();
        if (markersPlugin.getMarker(lastDotId)) markersPlugin.removeMarker(lastDotId);
      }
    }

    window.finalizarPoligono = function(event) {
      if(event) { event.stopPropagation(); }
      if (!modoDesenho) return;

      if (pontosPoligonoAtual.length >= 3) {
        const markersPlugin = viewer.getPlugin(MarkersPlugin);
        
        try {
          // CORREÇÃO: Converte a lista de objetos {yaw, pitch} para uma lista de pares numéricos [yaw, pitch]
          const linePoints = pontosPoligonoAtual.map(p => [p.yaw, p.pitch]);
          // Adiciona o primeiro ponto ao final para fechar o lote
          linePoints.push([pontosPoligonoAtual[0].yaw, pontosPoligonoAtual[0].pitch]); 

          const poligonoId = 'lote_' + Date.now();
          
          // Desenha a linha no formato correto (array de arrays)
          markersPlugin.addMarker({
            id: poligonoId,
            polyline: linePoints, 
            svgStyle: { stroke: '#c5a059', strokeWidth: '4px' }
          });
          
          // Salva os dados também no formato correto para o tour.html
          marcacoes.push({ id: poligonoId, type: 'poligono', polyline: linePoints });
          
          limparTemporarios();
          desativarModos();
        } catch (e) {
          alert("Erro interno ao desenhar: " + e.message);
          console.error(e);
        }
      } else {
        alert('Você precisa tocar em pelo menos 3 cantos.');
      }
    }

    window.cancelarDesenho = function(event) {
      if(event) { event.stopPropagation(); }
      limparTemporarios();
      desativarModos();
    }

    window.apagarSelecionado = function(event) {
      if(event) { event.stopPropagation(); }
      if (!selectedMarkerId) return;
      const markersPlugin = viewer.getPlugin(MarkersPlugin);
      markersPlugin.removeMarker(selectedMarkerId);
      marcacoes = marcacoes.filter(m => m.id !== selectedMarkerId);
      fecharPainelEdicao();
    }

    window.fecharPainelEdicao = function(event) {
      if(event) { event.stopPropagation(); }
      document.getElementById('panel-edicao').style.display = 'none';
      selectedMarkerId = null;
    }

    function limparTemporarios() {
      const markersPlugin = viewer.getPlugin(MarkersPlugin);
      for(let i=1; i <= 50; i++) {
        if(markersPlugin.getMarker('dot_' + i)) markersPlugin.removeMarker('dot_' + i);
      }
      pontosPoligonoAtual = [];
    }

    function desativarModos() {
      modoPonto = false;
      modoDesenho = false;
      atualizarBotoesUI();
    }

    function atualizarBotoesUI() {
      const btnMarcar = document.getElementById('btn-marcar');
      const btnDesenhar = document.getElementById('btn-desenhar');
      const aviso = document.getElementById('aviso-modo');
      
      if (modoPonto) {
        btnMarcar.innerText = '❌ Cancelar Ponto';
        btnMarcar.classList.add('ativo');
        aviso.innerText = 'Toque na imagem para adicionar o ponto';
        aviso.style.display = 'block';
        document.getElementById('controls-panel').classList.remove('open');
        document.getElementById('menu-toggle').innerText = '☰';
      } else if (modoDesenho) {
        btnDesenhar.innerText = '❌ Cancelar Desenho';
        btnDesenhar.classList.add('ativo');
        aviso.innerText = 'Toque nos cantos do lote (min. 3)';
        aviso.style.display = 'block';
        document.getElementById('controls-panel').classList.remove('open');
        document.getElementById('menu-toggle').innerText = '☰';
      } else {
        btnMarcar.innerText = '📍 Adicionar Ponto';
        btnDesenhar.innerText = '✏️ Desenhar Lote';
        btnMarcar.classList.remove('ativo');
        btnDesenhar.classList.remove('ativo');
        aviso.style.display = 'none';
        document.getElementById('action-buttons').style.display = 'none';
      }
    }

    window.salvarTour = async function(event) {
      if(event) { event.stopPropagation(); }
      const file = document.getElementById('foto').files[0];
      if (!file) return alert('Carregue uma foto primeiro.');
      if (marcacoes.length === 0) return alert('Adicione algo antes de salvar.');

      const btnSalvar = document.getElementById('btn-salvar');
      btnSalvar.disabled = true;
      btnSalvar.innerText = '⏳ Salvando...';

      try {
        const options = { maxSizeMB: 4, maxWidthOrHeight: 8192, useWebWorker: true, onProgress: (progress) => { btnSalvar.innerText = `⏳ Comprimindo (${Math.round(progress)}%)`; } };
        const arquivoComprimido = await imageCompression(file, options);
        
        btnSalvar.innerText = '⏳ Enviando...';
        const id = Date.now().toString(36);
        const formData = new FormData();
        formData.append('foto', arquivoComprimido);
        formData.append('marcacoes', JSON.stringify(marcacoes));

        const resp = await fetch(`/api/salvar/${id}`, { method: 'POST', body: formData });

        if (resp.ok) {
          document.getElementById('linkTour').value = `${window.location.origin}/tour.html?id=${id}`;
          alert('Tour salvo com sucesso!');
        } else { alert('Erro ao salvar.'); }
      } catch (err) { alert('Erro ao processar.'); console.error(err); } 
      finally { btnSalvar.disabled = false; btnSalvar.innerText = '💾 Salvar tour'; }
    }

    window.copiarLink = function(event) {
      if(event) { event.stopPropagation(); }
      const input = document.getElementById('linkTour');
      if (!input.value) return alert('Salve o tour primeiro.');
      navigator.clipboard.writeText(input.value);
      alert('Link copiado!');
    }
  </script>
</body>
</html>
