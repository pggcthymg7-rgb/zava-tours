<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zava Tour — Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    /* ... (mantenha o mesmo CSS que você já tem) ... */
  </style>
</head>
<body>
  <header><h1>❖ ZAVA TOUR — Editor</h1></header>
  <div class="container">
    <div class="sidebar">
      <input type="file" id="foto" accept="image/jpeg" class="hidden">
      <button class="btn-gold" onclick="document.getElementById('foto').click()">📂 Carregar foto 360°</button>
      <button class="btn-outline" onclick="adicionarMarcacao()">📍 Adicionar marcação</button>
      <button class="btn-gold" onclick="salvarTour()">💾 Salvar tour</button>
      <hr style="border-color:#333; margin:16px 0;">
      <p style="font-size:12px; color:#aaa; margin-bottom:4px;">Link do tour salvo:</p>
      <input type="text" id="linkTour" readonly placeholder="Ainda não salvo" style="background:#222; color:#fff; font-size:12px;">
      <button class="btn-outline" onclick="copiarLink()">🔗 Copiar link</button>
      <p style="font-size:11px; color:#666; margin-top:20px;">Dica: Gire a imagem, adicione as marcações e salve para gerar o link do cliente.</p>
    </div>
    <div id="panorama"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <!-- Biblioteca de compressão de imagem no navegador -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <script>
    let viewer = pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: 'https://pannellum.org/images/alma.jpg',
      autoLoad: true
    });

    let marcacoes = [];

    document.getElementById('foto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        viewer.destroy();
        viewer = pannellum.viewer('panorama', {
          type: 'equirectangular',
          panorama: ev.target.result,
          autoLoad: true
        });
        marcacoes = [];
      };
      reader.readAsDataURL(file);
    });

    function adicionarMarcacao() {
      const titulo = prompt('Título da marcação (ex: Lote 04, Portaria):');
      if (!titulo) return;
      const pitch = viewer.getPitch();
      const yaw = viewer.getYaw();
      viewer.addHotSpot({ pitch, yaw, type: 'info', text: titulo, cssClass: 'custom-hotspot' });
      marcacoes.push({ pitch, yaw, titulo });
    }

    async function salvarTour() {
      const file = document.getElementById('foto').files[0];
      if (!file) return alert('Carregue uma foto primeiro.');

      // 1. Comprimir a imagem antes de enviar (reduz de ~20 MB para ~2-4 MB)
      alert('Comprimindo imagem... isso pode levar alguns segundos.');
      let arquivoComprimido;
      try {
        const options = {
          maxSizeMB: 4,           // Tamanho máximo final (4 MB)
          maxWidthOrHeight: 8192, // Resolução máxima (mantém qualidade 360°)
          useWebWorker: true
        };
        arquivoComprimido = await imageCompression(file, options);
      } catch (err) {
        console.error('Erro na compressão:', err);
        alert('Erro ao comprimir a imagem. Tentando enviar o original...');
        arquivoComprimido = file;
      }

      const id = Date.now().toString(36);

      const formData = new FormData();
      formData.append('foto', arquivoComprimido);
      formData.append('marcacoes', JSON.stringify(marcacoes));

      alert('Salvando... aguarde.');

      try {
        const resp = await fetch(`/api/salvar/${id}`, {
          method: 'POST',
          body: formData
        });

        if (resp.ok) {
          const link = `${window.location.origin}/tour.html?id=${id}`;
          document.getElementById('linkTour').value = link;
          alert('Tour salvo com sucesso!');
        } else {
          alert('Erro ao salvar. Tente novamente.');
        }
      } catch (err) {
        alert('Erro de conexão ao salvar.');
        console.error(err);
      }
    }

    function copiarLink() {
      const input = document.getElementById('linkTour');
      if (!input.value) return alert('Salve o tour primeiro.');
      navigator.clipboard.writeText(input.value);
      alert('Link copiado!');
    }
  </script>
</body>
</html>
