<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zava Tour</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    body { margin: 0; background: #000; font-family: sans-serif; }
    #panorama { width: 100vw; height: 100vh; }
    #alerta { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(200, 0, 0, 0.9); color: white; padding: 12px; z-index: 1000; border-radius: 8px; display: none; text-align: center; font-size: 14px; }
    .custom-hotspot { background: #c5a059; border: 2px solid #fff; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; box-shadow: 0 0 15px rgba(197,160,89,0.9); }
  </style>
</head>
<body>
  <div id="alerta"></div>
  <div id="panorama"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script>
    const R2_URL = "https://pub-16d4012b923340a3876d0dd16e806393.r2.dev";
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.body.innerHTML = '<h1 style="color:#fff;padding:20px;">Tour não encontrado.</h1>';
    } else {
      const viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: `${R2_URL}/tours/${id}.jpg`,
        autoLoad: true
      });

      fetch(`/api/carregar/${id}`)
        .then(async r => {
          const texto = await r.text();
          if (!r.ok) throw new Error(`Erro ${r.status}: ${texto}`);
          return JSON.parse(texto);
        })
        .then(dados => {
          // A MÁGICA ACONTECE AQUI: o arquivo salvo é uma lista direta, não um objeto
          const lista = Array.isArray(dados) ? dados : dados.marcacoes;
          
          if (lista && lista.length > 0) {
            lista.forEach(m => {
              viewer.addHotSpot({ 
                pitch: m.pitch, 
                yaw: m.yaw, 
                type: 'info', 
                text: m.titulo,
                cssClass: 'custom-hotspot' 
              });
            });
          }
        })
        .catch(err => {
          console.error("Erro:", err);
          const alerta = document.getElementById('alerta');
          alerta.style.display = 'block';
          alerta.innerHTML = `<strong>Aviso:</strong> A foto carregou, mas as marcações falharam.<br><small>Motivo: ${err.message}</small>`;
        });
    }
  </script>
</body>
</html>
